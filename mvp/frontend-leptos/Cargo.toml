# The Leptos frontend: the third build in the side-by-side (mvp/docs/
# frontend-leptos-plan.md). Same architecture as mvp/frontend-svelte (Svelte)
# and mvp/frontend-rs (egui), so the comparison isolates what a DOM-based Rust
# renderer buys over both. A member of the mvp workspace (not detached
# anymore — rust-cache and scripts/affected-crates.mts's dep-info scoping
# neutralise the original "keep native builds fast" reason to separate it,
# and CI never ran its tests/clippy/fmt while it was); the shared WS contract
# arrives as a path dependency on ws-types, the one definition every side uses
# (drift impossible).
[package]
name = "tower-frontend-leptos"
version = "0.1.0"
edition.workspace = true

[dependencies]
# HTML sanitizer for the rendered markdown output — verified to build under
# --target wasm32-unknown-unknown (pure Rust HTML parsing, no OS/thread deps).
ammonia = "4.1.4"
pulldown-cmark = { workspace = true, features = ["html"] }
# leptos 0.8 (stable) over the 0.9 alpha in the vetted clone — deliberate:
# this build is testing the DOM-render axis, not tracking bleeding-edge
# leptos.
leptos = { version = "0.8", features = ["csr"] }
serde_json = "1"
ws-types = { path = "../crates/ws-types" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# wasm32 is single-threaded; on_cleanup requires Send + Sync (leptos's shared
# reactive_graph crate also targets multi-threaded ssr) — SendWrapper is the
# accepted way to hand it a !Send Closure without an actual thread ever
# touching it.
send_wrapper = "0.6"
# gloo-net's WebSocket: an async Stream/Sink split, not ewebsock's try_recv
# channel — the natural fit for Leptos's push-based reactive graph rather than
# egui's per-frame pull.
gloo-net = { version = "0.6", features = ["websocket", "http"] }
futures = "0.3"
web-sys = { version = "0.3", features = [
  "ClipboardEvent",
  "CssStyleDeclaration",
  "DataTransfer",
  "DataTransferItem",
  "DataTransferItemList",
  "Document",
  "Element",
  "File",
  "FileList",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "Location",
  "Node",
  "Storage",
  "Window",
  "DomRect",
  "DomRectReadOnly",
  "ResizeObserver",
  "ResizeObserverEntry",
  "ResizeObserverSize",
  "console",
] }
console_error_panic_hook = "0.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# Browser-run tests (wasm-bindgen-test-runner via .cargo/config.toml): the
# row-measurement contract can only be proven against a real layout engine.
wasm-bindgen-test = "0.3"
