[package]
name = "bridge"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

# The bridge agent: an agent host proving the concerns end to end without
# claude-sdk-cli. Stdio spawn control, the servicer discipline on NATS, the
# messages API over SSE, the Skill tool, and Bash gated behind the approval
# concern (every command asks, v1). Deliberate cuts: no persistence, no
# compaction.
[dependencies]
wire = { path = "../wire" }
anyhow.workspace = true
async-nats.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
image.workspace = true
interprocess.workspace = true
libc.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
yaml_serde.workspace = true

# The GitHub pull request tools and the Keychain read behind them, both macOS
# only. Off macOS bridge builds without them: the six tools are not offered,
# and no credential can be read.
[target.'cfg(target_os = "macos")'.dependencies]
bridge-secrets = { path = "../bridge-secrets" }
bridge-tools-github = { path = "../bridge-tools-github" }

[dev-dependencies]
# The only fake (bridge-testkit's FakeBroker) plus a test scratch-dir
# helper. A dev-dependency compiles for any test/bench in this crate,
# binary target included, with no feature flag for CI to remember, and
# never ships in a normal build.
bridge-testkit = { path = "../bridge-testkit" }
