[package]
name = "bridge-tools-github"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

# The six GitHub pull request tools. Each hardcodes its gh subcommand and the
# exact flags it can ever emit, and spawns gh itself: the privileged
# credential is read at spawn time and lives in that one child's environment,
# nowhere else. Deliberately no dependency on `bridge` — this crate knows
# about gh and about a secret account name, and nothing about conversations.
[dependencies]
bridge-secrets = { path = "../bridge-secrets" }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
