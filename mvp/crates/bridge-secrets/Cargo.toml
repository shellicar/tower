[package]
name = "bridge-secrets"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

# Keychain access for the credentials bridge holds and hands to a child
# process. The crate compiles everywhere; only the binding is macOS-gated, so
# a caller off macOS gets a runtime answer rather than a missing symbol.
[dependencies]
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true
