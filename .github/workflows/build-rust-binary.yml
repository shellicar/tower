name: Build Rust binary

# Reusable: builds one native cargo binary (towerd, bridge, helm) across all
# three platforms and uploads each as a version-named artifact.
on:
  workflow_call:
    inputs:
      package:
        description: Crate name to build
        required: true
        type: string
      version:
        description: Version to embed in the artifact filename; falls back to a short commit sha when empty
        required: false
        type: string
        default: ''
      should_run:
        description: False skips the build (used to select one app out of a caller's matrix on a tag push, since the caller's job-level `if:` can't see `matrix`)
        required: false
        type: boolean
        default: true

jobs:
  binary:
    if: inputs.should_run
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: windows-2022
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mvp
      - run: cargo build --release -p ${{ inputs.package }}
        working-directory: mvp
      - name: Package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          VERSION="${VERSION:-0.0.0-$(git rev-parse --short HEAD)}"
          mkdir out
          cp "mvp/target/release/${{ inputs.package }}$ext" out/
          FILE="${{ inputs.package }}-$VERSION-${{ matrix.platform }}.tar.gz"
          tar czf "$FILE" -C out .
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$FILE" > "$FILE.sha256"; else shasum -a 256 "$FILE" > "$FILE.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: tower-${{ inputs.package }}-${{ matrix.platform }}
          path: |
            ${{ inputs.package }}-*-${{ matrix.platform }}.tar.gz
            ${{ inputs.package }}-*-${{ matrix.platform }}.tar.gz.sha256
