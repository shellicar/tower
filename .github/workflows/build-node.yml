name: Build Node app

# Reusable: builds one pnpm-based frontend and uploads it as a version-named
# artifact. Platform-independent — one build, one artifact.
on:
  workflow_call:
    inputs:
      package:
        description: Directory to build (e.g. frontend-svelte)
        required: true
        type: string
      app_name:
        description: Name used in the tag/artifact
        required: true
        type: string
      version:
        description: Version to embed in the artifact filename; falls back to a short commit sha when empty
        required: false
        type: string
        default: ''
      should_run:
        description: False skips the build (used to select one app on a tag push)
        required: false
        type: boolean
        default: true

jobs:
  build:
    if: inputs.should_run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: mvp/${{ inputs.package }}
      - run: pnpm build
        working-directory: mvp/${{ inputs.package }}
      - name: Package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          VERSION="${VERSION:-0.0.0-$(git rev-parse --short HEAD)}"
          FILE="${{ inputs.app_name }}-$VERSION.tar.gz"
          tar czf "$FILE" -C mvp/${{ inputs.package }}/dist .
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$FILE" > "$FILE.sha256"; else shasum -a 256 "$FILE" > "$FILE.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: tower-${{ inputs.app_name }}
          path: |
            ${{ inputs.app_name }}-*.tar.gz
            ${{ inputs.app_name }}-*.tar.gz.sha256
