name: CI

# One workflow, gated by event — same shape as docker/compose's ci.yml.
# Five independently versioned apps, each its own tag name: towerd, bridge,
# helm, tower-svelte, tower-leptos (egui/frontend-rs is a comparison build
# only, never shipped). Pushing the tag `<app>@<version>` (e.g.
# `towerd@1.2.3`, `helm@1.2.3-alpha.1`) fires this workflow directly — the
# tag push trigger is scoped to exactly these five patterns, so a tag
# outside this set (a `tower@x` suite tag, say) never invokes this workflow
# at all, not even to skip a job. A tag only builds and uploads that one
# app's artifact; it never creates a GitHub Release. The only release is
# the suite release, cut separately by hand from already-tagged versions.
#
# - pull_request / push to main: build every app (nothing published) so a
#   broken build is caught before it reaches main.
# - one of the five tags is pushed: build and upload only the one app it names.
on:
  push:
    branches: [main]
    tags:
      - 'towerd@*'
      - 'bridge@*'
      - 'helm@*'
      - 'tower-svelte@*'
      - 'tower-leptos@*'
  pull_request:
    branches: [main]

jobs:
  # Whole-workspace correctness: test, lint, and format-check every crate
  # (mirrors `just test`/`just check`), the Svelte frontend's own type-check
  # and test scripts, and that every changes.jsonl is valid and its
  # package's CHANGELOG.md isn't stale (mirrors `just changes-check`). The
  # build jobs below only prove things compile; this is the one that proves
  # they're right.
  #
  # On a PR, scoped to affected crates only (scripts/affected-crates.mts —
  # exact, dep-info-based, not a directory-prefix guess). On push to main,
  # always the full workspace instead: the scoped run only sees what the
  # dep-info pass sees, so main still needs one real run against everything
  # to catch what that missed (a build script side effect, say).
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mvp
      - name: Determine build scope
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            PACKAGES=$(node scripts/affected-crates.mts "origin/${{ github.base_ref }}" --format=cargo-args --tier=affected)
            echo "packages=${PACKAGES:---workspace}" >> "$GITHUB_OUTPUT"
            echo "fmt_packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          else
            echo "packages=--workspace" >> "$GITHUB_OUTPUT"
            echo "fmt_packages=" >> "$GITHUB_OUTPUT"
          fi
        working-directory: mvp
      - run: cargo test ${{ steps.scope.outputs.packages }}
        working-directory: mvp
      - run: cargo clippy ${{ steps.scope.outputs.packages }}
        working-directory: mvp
      - run: cargo fmt --check ${{ steps.scope.outputs.fmt_packages }}
        working-directory: mvp
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: mvp/frontend-svelte
      - run: pnpm check
        working-directory: mvp/frontend-svelte
      - run: pnpm test
        working-directory: mvp/frontend-svelte
      - run: node scripts/validate-changes.mts
      - name: Check changelog drift
        run: |
          node scripts/generate-all-changelogs.mts
          git diff --exit-code -- '*/CHANGELOG.md'

  # Splits the pushed tag (`<app>@<version>`) into its two halves. Empty on
  # pull_request/branch push — nothing here reads its outputs on those
  # triggers.
  detect:
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.tag.outputs.app }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            echo "app=${TAG%%@*}" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#*@}" >> "$GITHUB_OUTPUT"
          fi

  # --- towerd / bridge / helm: same build shape, three cargo binaries,
  # via the reusable build-rust.yml (kind: binary) matrixed over the app ---
  binary:
    needs: detect
    strategy:
      fail-fast: false
      matrix:
        package: [towerd, bridge, helm]
    uses: ./.github/workflows/build-rust.yml
    with:
      package: ${{ matrix.package }}
      app_name: ${{ matrix.package }}
      kind: binary
      version: ${{ needs.detect.outputs.version }}
      should_run: ${{ github.ref_type != 'tag' || needs.detect.outputs.app == matrix.package }}

  # --- the two web frontends: platform-independent, one build each --------
  frontend-svelte:
    needs: detect
    if: github.ref_type != 'tag' || needs.detect.outputs.app == 'tower-svelte'
    uses: ./.github/workflows/build-node.yml
    with:
      package: frontend-svelte
      app_name: tower-svelte
      version: ${{ needs.detect.outputs.version }}

  frontend-leptos:
    needs: detect
    if: github.ref_type != 'tag' || needs.detect.outputs.app == 'tower-leptos'
    uses: ./.github/workflows/build-rust.yml
    with:
      package: frontend-leptos
      app_name: tower-leptos
      kind: wasm
      version: ${{ needs.detect.outputs.version }}

  # One stable check name for a branch ruleset to require. The real jobs
  # above carry per-matrix names (binary (towerd) / build (macos-14,
  # darwin-arm64), etc.) that a ruleset can't pin to a fixed list. Passes
  # when every needed job succeeded or was skipped (an app's build job
  # skipping on another app's tag is expected); fails only if one actually
  # failed or was cancelled.

  gate:
    needs:
      [
        checks,
        detect,
        binary,
        frontend-svelte,
        frontend-leptos,
      ]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every needed job to have succeeded or skipped
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A needed job failed or was cancelled"
          exit 1
