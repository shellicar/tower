name: Build Rust app

# Reusable: builds one Rust app and uploads it as a version-named artifact.
# `kind: binary` builds a native cargo binary across all three platforms
# (towerd, bridge, helm); `kind: wasm` builds the one wasm frontend
# (frontend-leptos) via trunk, once, platform-independent.
on:
  workflow_call:
    inputs:
      package:
        description: Crate name (binary) or directory (wasm) to build
        required: true
        type: string
      app_name:
        description: Name used in the tag/artifact (matches the crate name for a binary; the app's own name for frontend-leptos)
        required: true
        type: string
      kind:
        description: 'binary or wasm'
        required: true
        type: string
      version:
        description: Version to embed in the artifact filename; falls back to a short commit sha when empty
        required: false
        type: string
        default: ''

jobs:
  binary:
    if: inputs.kind == 'binary'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: windows-2022
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mvp
      - run: cargo build --release -p ${{ inputs.package }}
        working-directory: mvp
      - name: Package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          VERSION="${VERSION:-0.0.0-$(git rev-parse --short HEAD)}"
          mkdir out
          cp "mvp/target/release/${{ inputs.package }}$ext" out/
          tar czf "${{ inputs.package }}-$VERSION-${{ matrix.platform }}.tar.gz" -C out .
      - uses: actions/upload-artifact@v4
        with:
          name: tower-${{ inputs.app_name }}-${{ matrix.platform }}
          path: ${{ inputs.package }}-*-${{ matrix.platform }}.tar.gz

  wasm:
    if: inputs.kind == 'wasm'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mvp
      - run: rustup target add wasm32-unknown-unknown
      - uses: jetli/trunk-action@v0.5.0
      - run: trunk build --release
        working-directory: mvp/${{ inputs.package }}
      - name: Package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          VERSION="${VERSION:-0.0.0-$(git rev-parse --short HEAD)}"
          tar czf "${{ inputs.app_name }}-$VERSION.tar.gz" -C mvp/${{ inputs.package }}/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: tower-${{ inputs.app_name }}
          path: ${{ inputs.app_name }}-*.tar.gz
