name: Release

# One workflow, gated by event — same shape as docker/compose's ci.yml.
# Five independently releasable apps, each its own tag/release name:
# towerd, bridge, helm, tower-svelte, tower-leptos (egui/frontend-rs is a
# comparison build only, never shipped). A release is created with the tag
# `<app>@<version>` (e.g. `towerd@1.2.3`, `helm@1.2.3-alpha.1`) — creating it
# fires this workflow (`release: created`), which builds and publishes only
# that one app, not the other four.
#
# - pull_request / push to main: build every app (nothing published) so a
#   broken build is caught before it reaches main.
# - a release is created: build and publish only the one app its tag names.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  # Whole-workspace correctness: test, lint, and format-check every crate
  # (mirrors `just test`/`just check`), plus the Svelte frontend's own
  # type-check and test scripts. The build jobs below only prove things
  # compile; this is the one that proves they're right.
  #
  # On a PR, scoped to affected crates only (scripts/affected-crates.mts —
  # exact, dep-info-based, not a directory-prefix guess). On push to main,
  # always the full workspace: the backstop a delta-scoped check always
  # needs, since the scoping is best-effort against anything the dep-info
  # pass didn't see (a build script side effect, say).
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mvp
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Determine build scope
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            PACKAGES=$(node scripts/affected-crates.mts "origin/${{ github.base_ref }}" --format=cargo-args --tier=affected)
            echo "packages=${PACKAGES:---workspace}" >> "$GITHUB_OUTPUT"
            echo "fmt_packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          else
            echo "packages=--workspace" >> "$GITHUB_OUTPUT"
            echo "fmt_packages=" >> "$GITHUB_OUTPUT"
          fi
        working-directory: mvp
      - run: cargo test ${{ steps.scope.outputs.packages }}
        working-directory: mvp
      - run: cargo clippy ${{ steps.scope.outputs.packages }}
        working-directory: mvp
      - run: cargo fmt --check ${{ steps.scope.outputs.fmt_packages }}
        working-directory: mvp
      - run: pnpm install --frozen-lockfile
        working-directory: mvp/frontend
      - run: pnpm check
        working-directory: mvp/frontend
      - run: pnpm test
        working-directory: mvp/frontend

  # Splits the release's tag (`<app>@<version>`) into its two halves. Empty
  # on pull_request/push — nothing here reads its outputs on those triggers.
  detect:
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.tag.outputs.app }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            echo "app=${TAG%%@*}" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#*@}" >> "$GITHUB_OUTPUT"
          fi

  # --- towerd / bridge / helm: same build shape, three cargo binaries ------
  binary-towerd:
    needs: detect
    if: github.event_name != 'release' || needs.detect.outputs.app == 'towerd'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: windows-2022
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mvp
      - run: cargo build --release -p towerd
        working-directory: mvp
      - name: Package
        shell: bash
        run: |
          set -eu
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mkdir out
          cp "mvp/target/release/towerd$ext" out/
          tar czf "towerd-${{ matrix.platform }}.tar.gz" -C out .
      - uses: actions/upload-artifact@v4
        with:
          name: tower-towerd-${{ matrix.platform }}
          path: towerd-${{ matrix.platform }}.tar.gz

  binary-bridge:
    needs: detect
    if: github.event_name != 'release' || needs.detect.outputs.app == 'bridge'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: windows-2022
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mvp
      - run: cargo build --release -p bridge
        working-directory: mvp
      - name: Package
        shell: bash
        run: |
          set -eu
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mkdir out
          cp "mvp/target/release/bridge$ext" out/
          tar czf "bridge-${{ matrix.platform }}.tar.gz" -C out .
      - uses: actions/upload-artifact@v4
        with:
          name: tower-bridge-${{ matrix.platform }}
          path: bridge-${{ matrix.platform }}.tar.gz

  binary-helm:
    needs: detect
    if: github.event_name != 'release' || needs.detect.outputs.app == 'helm'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: windows-2022
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mvp
      - run: cargo build --release -p helm
        working-directory: mvp
      - name: Package
        shell: bash
        run: |
          set -eu
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mkdir out
          cp "mvp/target/release/helm$ext" out/
          tar czf "helm-${{ matrix.platform }}.tar.gz" -C out .
      - uses: actions/upload-artifact@v4
        with:
          name: tower-helm-${{ matrix.platform }}
          path: helm-${{ matrix.platform }}.tar.gz

  # --- the two web frontends: platform-independent, one build each --------
  frontend-svelte:
    needs: detect
    if: github.event_name != 'release' || needs.detect.outputs.app == 'tower-svelte'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: mvp/frontend
      - run: pnpm build
        working-directory: mvp/frontend
      - run: tar czf tower-svelte.tar.gz -C mvp/frontend/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: tower-tower-svelte
          path: tower-svelte.tar.gz

  frontend-leptos:
    needs: detect
    if: github.event_name != 'release' || needs.detect.outputs.app == 'tower-leptos'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mvp/frontend-leptos
      - run: rustup target add wasm32-unknown-unknown
      - uses: jetli/trunk-action@v0.5.0
      - run: trunk build --release
        working-directory: mvp/frontend-leptos
      - run: tar czf tower-leptos.tar.gz -C mvp/frontend-leptos/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: tower-tower-leptos
          path: tower-leptos.tar.gz

  # --- publish: one job, attaches whichever app's artifacts matched --------
  publish:
    needs: [detect, binary-towerd, binary-bridge, binary-helm, frontend-svelte, frontend-leptos]
    if: always() && github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # No dash before the star: frontend artifacts have no platform
          # suffix (tower-tower-svelte), binaries do (tower-towerd-darwin-arm64).
          pattern: tower-${{ needs.detect.outputs.app }}*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: true
          overwrite_files: false

  # One stable check name for a branch ruleset to require. The real jobs
  # above carry per-matrix names (binary-towerd (macos-14, darwin-arm64),
  # etc.) that a ruleset can't pin to a fixed list. Passes when every needed
  # job succeeded or was skipped (a release-only job skipping on a plain PR
  # is expected); fails only if one actually failed or was cancelled.
  gate:
    needs:
      [
        checks,
        detect,
        binary-towerd,
        binary-bridge,
        binary-helm,
        frontend-svelte,
        frontend-leptos,
        publish,
      ]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every needed job to have succeeded or skipped
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A needed job failed or was cancelled"
          exit 1
