name: Release

# Tag push (v*) builds everything in mvp/ and publishes a GitHub Release:
# per-platform tarballs of the three binaries (towerd, bridge, helm — helm
# spawns bridge as a child via HELM_BRIDGE_PATH, so they ship together), and
# the two frontend dist/ bundles as separate assets, since towerd picks
# either one at runtime via TOWER_DIST. egui (frontend-rs) is a comparison
# build, not a shipped artifact — deliberately left out.
on:
  push:
    tags:
      - 'v*'

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: windows-2022
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mvp
      - run: cargo build --release --workspace -p towerd -p bridge -p helm
        working-directory: mvp

      - name: Package
        shell: bash
        run: |
          set -eu
          out="tower-${{ matrix.platform }}"
          mkdir "$out"
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          for bin in towerd bridge helm; do
            cp "mvp/target/release/$bin$ext" "$out/"
          done
          tar czf "$out.tar.gz" "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: tower-${{ matrix.platform }}
          path: tower-${{ matrix.platform }}.tar.gz

  frontend-svelte:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: mvp/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: mvp/frontend
      - run: pnpm build
        working-directory: mvp/frontend

      - name: Package
        run: tar czf tower-frontend-svelte.tar.gz -C mvp/frontend/dist .

      - uses: actions/upload-artifact@v4
        with:
          name: tower-frontend-svelte
          path: tower-frontend-svelte.tar.gz

  frontend-leptos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mvp/frontend-leptos
      - run: rustup target add wasm32-unknown-unknown
      - uses: jetli/trunk-action@v0.5.0
      - run: trunk build --release
        working-directory: mvp/frontend-leptos

      - name: Package
        run: tar czf tower-frontend-leptos.tar.gz -C mvp/frontend-leptos/dist .

      - uses: actions/upload-artifact@v4
        with:
          name: tower-frontend-leptos
          path: tower-frontend-leptos.tar.gz

  release:
    needs: [binaries, frontend-svelte, frontend-leptos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
