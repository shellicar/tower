<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 990" width="1760" height="990" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #1B1826; }
      .title { fill: #FBF6E3; font-size: 34px; font-weight: 700; }
      .purpose { fill: #AEB6BF; font-size: 19px; }
      .side { fill: #7F8C8D; font-size: 15px; font-weight: 700; letter-spacing: 2.5px; }
      .sideclaim { font-size: 23px; font-weight: 700; }
      .note { fill: #AEB6BF; font-size: 17px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .termbody { fill: #12101C; stroke: #3A3550; }
      .termbar { fill: #241F38; }
      .termline { fill: #322C48; }
      .blocked { stroke: #E67E22; }
      .rowsep { stroke: #2E2942; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1760" height="990"/>

  <text class="title" x="60" y="72">A tool use is waiting for a human. Where is the question?</text>
  <text class="purpose" x="60" y="106">The agent has stopped. It cannot continue until somebody answers. Everything below follows from where that question is allowed to live.</text>

  <line x1="880" y1="150" x2="880" y2="930" stroke="#3A3550" stroke-width="1"/>

  <!-- ============ LEFT: the question lives where the agent runs ============ -->
  <text class="side" x="60" y="188">TODAY</text>
  <text class="sideclaim" x="60" y="222" fill="#E0A96D">The question lives where the agent runs</text>

  <!-- terminal grid: 3 x 3 -->
  <!-- row 1 -->
  <g transform="translate(60,250)">
    <rect class="termbody" width="190" height="118" rx="7"/>
    <rect class="termbar" width="190" height="18" rx="7"/><rect class="termbar" y="10" width="190" height="8"/>
    <circle cx="12" cy="9" r="3" fill="#4A4363"/><circle cx="24" cy="9" r="3" fill="#4A4363"/><circle cx="36" cy="9" r="3" fill="#4A4363"/>
    <rect class="termline" x="12" y="34" width="120" height="6" rx="3"/>
    <rect class="termline" x="12" y="50" width="86" height="6" rx="3"/>
    <rect class="termline" x="12" y="66" width="142" height="6" rx="3"/>
    <rect class="termline" x="12" y="82" width="64" height="6" rx="3"/>
  </g>
  <g transform="translate(270,250)">
    <rect class="termbody blocked" width="190" height="118" rx="7" stroke-width="2"/>
    <rect class="termbar" width="190" height="18" rx="7"/><rect class="termbar" y="10" width="190" height="8"/>
    <circle cx="12" cy="9" r="3" fill="#4A4363"/><circle cx="24" cy="9" r="3" fill="#4A4363"/><circle cx="36" cy="9" r="3" fill="#4A4363"/>
    <rect class="termline" x="12" y="34" width="132" height="6" rx="3"/>
    <rect class="termline" x="12" y="50" width="96" height="6" rx="3"/>
    <text class="mono" x="12" y="80" font-size="13" fill="#E67E22">may I run this? (y/n)</text>
    <rect x="12" y="90" width="9" height="15" fill="#E67E22"/>
  </g>
  <g transform="translate(480,250)">
    <rect class="termbody" width="190" height="118" rx="7"/>
    <rect class="termbar" width="190" height="18" rx="7"/><rect class="termbar" y="10" width="190" height="8"/>
    <circle cx="12" cy="9" r="3" fill="#4A4363"/><circle cx="24" cy="9" r="3" fill="#4A4363"/><circle cx="36" cy="9" r="3" fill="#4A4363"/>
    <rect class="termline" x="12" y="34" width="98" height="6" rx="3"/>
    <rect class="termline" x="12" y="50" width="140" height="6" rx="3"/>
    <rect class="termline" x="12" y="66" width="72" height="6" rx="3"/>
  </g>
  <!-- row 2 -->
  <g transform="translate(60,390)">
    <rect class="termbody blocked" width="190" height="118" rx="7" stroke-width="2"/>
    <rect class="termbar" width="190" height="18" rx="7"/><rect class="termbar" y="10" width="190" height="8"/>
    <circle cx="12" cy="9" r="3" fill="#4A4363"/><circle cx="24" cy="9" r="3" fill="#4A4363"/><circle cx="36" cy="9" r="3" fill="#4A4363"/>
    <rect class="termline" x="12" y="34" width="112" height="6" rx="3"/>
    <text class="mono" x="12" y="66" font-size="13" fill="#E67E22">may I run this? (y/n)</text>
    <rect x="12" y="76" width="9" height="15" fill="#E67E22"/>
  </g>
  <g transform="translate(270,390)">
    <rect class="termbody" width="190" height="118" rx="7" stroke="#5DADE2" stroke-width="2"/>
    <rect class="termbar" width="190" height="18" rx="7" fill="#1B2A3F"/><rect y="10" width="190" height="8" fill="#1B2A3F"/>
    <circle cx="12" cy="9" r="3" fill="#5DADE2"/><circle cx="24" cy="9" r="3" fill="#4A4363"/><circle cx="36" cy="9" r="3" fill="#4A4363"/>
    <rect class="termline" x="12" y="34" width="128" height="6" rx="3" fill="#3E5A78"/>
    <rect class="termline" x="12" y="50" width="88" height="6" rx="3" fill="#3E5A78"/>
    <rect class="termline" x="12" y="66" width="150" height="6" rx="3" fill="#3E5A78"/>
    <rect x="12" y="84" width="9" height="15" fill="#5DADE2"/>
    <text class="mono" x="134" y="13" font-size="11" fill="#5DADE2">in focus</text>
  </g>
  <g transform="translate(480,390)">
    <rect class="termbody" width="190" height="118" rx="7"/>
    <rect class="termbar" width="190" height="18" rx="7"/><rect class="termbar" y="10" width="190" height="8"/>
    <circle cx="12" cy="9" r="3" fill="#4A4363"/><circle cx="24" cy="9" r="3" fill="#4A4363"/><circle cx="36" cy="9" r="3" fill="#4A4363"/>
    <rect class="termline" x="12" y="34" width="76" height="6" rx="3"/>
    <rect class="termline" x="12" y="50" width="136" height="6" rx="3"/>
  </g>
  <!-- row 3 -->
  <g transform="translate(60,530)">
    <rect class="termbody" width="190" height="118" rx="7"/>
    <rect class="termbar" width="190" height="18" rx="7"/><rect class="termbar" y="10" width="190" height="8"/>
    <circle cx="12" cy="9" r="3" fill="#4A4363"/><circle cx="24" cy="9" r="3" fill="#4A4363"/><circle cx="36" cy="9" r="3" fill="#4A4363"/>
    <rect class="termline" x="12" y="34" width="140" height="6" rx="3"/>
    <rect class="termline" x="12" y="50" width="92" height="6" rx="3"/>
    <rect class="termline" x="12" y="66" width="118" height="6" rx="3"/>
  </g>
  <g transform="translate(270,530)">
    <rect class="termbody" width="190" height="118" rx="7"/>
    <rect class="termbar" width="190" height="18" rx="7"/><rect class="termbar" y="10" width="190" height="8"/>
    <circle cx="12" cy="9" r="3" fill="#4A4363"/><circle cx="24" cy="9" r="3" fill="#4A4363"/><circle cx="36" cy="9" r="3" fill="#4A4363"/>
    <rect class="termline" x="12" y="34" width="104" height="6" rx="3"/>
    <rect class="termline" x="12" y="50" width="148" height="6" rx="3"/>
  </g>
  <g transform="translate(480,530)">
    <rect class="termbody blocked" width="190" height="118" rx="7" stroke-width="2"/>
    <rect class="termbar" width="190" height="18" rx="7"/><rect class="termbar" y="10" width="190" height="8"/>
    <circle cx="12" cy="9" r="3" fill="#4A4363"/><circle cx="24" cy="9" r="3" fill="#4A4363"/><circle cx="36" cy="9" r="3" fill="#4A4363"/>
    <rect class="termline" x="12" y="34" width="120" height="6" rx="3"/>
    <text class="mono" x="12" y="66" font-size="13" fill="#E67E22">may I run this? (y/n)</text>
    <rect x="12" y="76" width="9" height="15" fill="#E67E22"/>
  </g>

  <text class="note" x="700" y="286" font-size="15">nine panes,</text>
  <text class="note" x="700" y="308" font-size="15">three tmux servers,</text>
  <text class="note" x="700" y="330" font-size="15">one screen</text>
  <text class="note" x="700" y="456" font-size="15" fill="#5DADE2">one pane in focus,</text>
  <text class="note" x="700" y="478" font-size="15" fill="#5DADE2">eight you cannot see into</text>

  <!-- the notification route -->
  <g transform="translate(60,690)">
    <rect width="300" height="66" rx="9" fill="#241F38" stroke="#4A4363"/>
    <rect x="14" y="16" width="34" height="34" rx="8" fill="#3A3413" stroke="#F1C40F"/>
    <text class="mono" x="60" y="32" font-size="13" fill="#FBF6E3">agent needs approval</text>
    <text class="mono" x="60" y="50" font-size="12" fill="#7F8C8D">tap to switch to its pane</text>
    <rect x="316" y="18" width="46" height="30" rx="8" fill="#241F38" stroke="#4A4363"/>
    <text class="mono" x="325" y="38" font-size="14" fill="#7F8C8D">+7</text>
  </g>

  <text class="note" x="60" y="800">You answer by going to the pane. The question is bound to the process that asked it,</text>
  <text class="note" x="60" y="828">so finding it is your job: tab through, remember which window was which, hold the map yourself.</text>
  <text class="note" x="60" y="866" fill="#E8867C">A pane that dies takes its question with it. Nobody can tell you what was asked.</text>
  <text class="note" x="60" y="894" fill="#E8867C">There is nowhere to look for the ones you have not seen, and no count of them.</text>

  <!-- ============ RIGHT: the question lives on the bus ============ -->
  <text class="side" x="940" y="188">WITH TOWER</text>
  <text class="sideclaim" x="940" y="222" fill="#9FE0B8">The question lives on the bus</text>

  <g transform="translate(940,250)">
    <rect width="760" height="398" rx="10" fill="#12101C" stroke="#2ECC71"/>
    <rect width="760" height="46" rx="10" fill="#14352A"/><rect y="36" width="760" height="10" fill="#14352A"/>
    <text x="20" y="30" font-size="17" font-weight="700" fill="#E8F8F0">Pending approvals</text>
    <text class="mono" x="200" y="30" font-size="15" fill="#9FE0B8">4 waiting</text>

    <!-- row 1 -->
    <line class="rowsep" x1="0" y1="46" x2="760" y2="46"/>
    <text class="mono" x="20" y="76" font-size="15" fill="#FBF6E3">Bash</text>
    <text class="mono" x="20" y="98" font-size="14" fill="#7F8C8D">tower · fix/virtual-list</text>
    <text class="mono" x="240" y="76" font-size="15" fill="#EAF2FB">git push --force-with-lease</text>
    <text class="mono" x="512" y="76" font-size="14" fill="#E0A96D">waiting 14m</text>
    <rect x="628" y="60" width="56" height="28" rx="6" fill="#14352A" stroke="#2ECC71"/>
    <text class="mono" x="640" y="79" font-size="13" fill="#9FE0B8">yes</text>
    <rect x="692" y="60" width="48" height="28" rx="6" fill="#3A1714" stroke="#E74C3C"/>
    <text class="mono" x="703" y="79" font-size="13" fill="#E8867C">no</text>

    <!-- row 2 -->
    <line class="rowsep" x1="0" y1="112" x2="760" y2="112"/>
    <text class="mono" x="20" y="142" font-size="15" fill="#FBF6E3">Write</text>
    <text class="mono" x="20" y="164" font-size="14" fill="#7F8C8D">eagers · release-epic</text>
    <text class="mono" x="240" y="142" font-size="15" fill="#EAF2FB">docs/spec/agent.md</text>
    <text class="mono" x="512" y="142" font-size="14" fill="#E0A96D">waiting 6m</text>
    <rect x="628" y="126" width="56" height="28" rx="6" fill="#14352A" stroke="#2ECC71"/>
    <text class="mono" x="640" y="145" font-size="13" fill="#9FE0B8">yes</text>
    <rect x="692" y="126" width="48" height="28" rx="6" fill="#3A1714" stroke="#E74C3C"/>
    <text class="mono" x="703" y="145" font-size="13" fill="#E8867C">no</text>

    <!-- row 3 -->
    <line class="rowsep" x1="0" y1="178" x2="760" y2="178"/>
    <text class="mono" x="20" y="208" font-size="15" fill="#FBF6E3">Bash</text>
    <text class="mono" x="20" y="230" font-size="14" fill="#7F8C8D">dotfiles · tmux-snapshot</text>
    <text class="mono" x="240" y="208" font-size="15" fill="#EAF2FB">docker compose down</text>
    <text class="mono" x="512" y="208" font-size="14" fill="#E0A96D">waiting 2m</text>
    <rect x="628" y="192" width="56" height="28" rx="6" fill="#14352A" stroke="#2ECC71"/>
    <text class="mono" x="640" y="211" font-size="13" fill="#9FE0B8">yes</text>
    <rect x="692" y="192" width="48" height="28" rx="6" fill="#3A1714" stroke="#E74C3C"/>
    <text class="mono" x="703" y="211" font-size="13" fill="#E8867C">no</text>

    <!-- row 4: the one nobody was there for -->
    <line class="rowsep" x1="0" y1="244" x2="760" y2="244"/>
    <rect x="1" y="245" width="758" height="66" fill="#241F38"/>
    <text class="mono" x="20" y="274" font-size="15" fill="#FBF6E3">Bash</text>
    <text class="mono" x="20" y="296" font-size="14" fill="#7F8C8D">home · overnight</text>
    <text class="mono" x="240" y="274" font-size="15" fill="#EAF2FB">rm -rf ./build</text>
    <text class="mono" x="512" y="274" font-size="14" fill="#F1C40F">waiting 7h</text>
    <rect x="628" y="258" width="56" height="28" rx="6" fill="#14352A" stroke="#2ECC71"/>
    <text class="mono" x="640" y="277" font-size="13" fill="#9FE0B8">yes</text>
    <rect x="692" y="258" width="48" height="28" rx="6" fill="#3A1714" stroke="#E74C3C"/>
    <text class="mono" x="703" y="277" font-size="13" fill="#E8867C">no</text>
    <line class="rowsep" x1="0" y1="311" x2="760" y2="311"/>
    <text class="mono" x="20" y="345" font-size="14" fill="#F1C40F">raised while nothing was listening, and still here</text>
  </g>

  <text class="note" x="940" y="700">Every ask, from every agent, in one place. You answer where you are, not where it happened.</text>
  <text class="note" x="940" y="728">The ask belongs to nobody: raised by an agent, answerable from any interface, by anyone connected.</text>
  <text class="note" x="940" y="766" fill="#9FE0B8">The question outlives the process that asked it, and outlives every screen looking at it.</text>
  <text class="note" x="940" y="794" fill="#9FE0B8">Nothing was watching overnight. The question waited anyway.</text>
</svg>
